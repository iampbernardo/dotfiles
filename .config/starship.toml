"$schema" = 'https://starship.rs/config-schema.json'

# NOSTROMO / two-line command console. No background jobs or network lookups.
add_newline = true
palette = 'nostromo'
format = """
[┌─](muted) $hostname$directory$git_branch$git_commit$git_status$git_state$cmd_duration$jobs$status$fill$time
[└─](muted) $character"""

[palettes.nostromo]
amber = '#e9ae55'
cyan = '#78c7c4'
muted = '#71858a'
red = '#f07167'

[hostname]
ssh_only = false
ssh_symbol = 'SSH '
style = 'bold amber'
format = '[\[$ssh_symbol$hostname\]]($style) [//](muted) '

[directory]
style = 'bold cyan'
format = '[$path]($style)[$read_only](red) '
truncation_length = 3
truncate_to_repo = true
truncation_symbol = '…/'
read_only = ' RO'

[git_branch]
style = 'amber'
format = '[::](muted) [$branch]($style) '
truncation_length = 28

[git_commit]
only_detached = true
style = 'amber'
format = '[DETACHED $hash]($style) '

[git_status]
style = 'amber'
format = '([$all_status$ahead_behind]($style) )'
conflicted = 'CONFLICT '
ahead = '↑$count '
behind = '↓$count '
diverged = '↑$ahead_count↓$behind_count '
untracked = '?$count '
stashed = '≡$count '
modified = '~$count '
staged = '+$count '
renamed = '»$count '
deleted = '-$count '

[git_state]
style = 'bold red'
format = '[$state( $progress_current/$progress_total)]($style) '

[cmd_duration]
min_time = 2000
style = 'muted'
format = '[T+$duration]($style) '

[jobs]
style = 'cyan'
format = '[JOBS:$number]($style) '
number_threshold = 1
symbol_threshold = 1

[status]
disabled = false
style = 'bold red'
format = '[EXIT:$status]($style) '

[character]
success_symbol = '[▶](bold amber)'
error_symbol = '[▶](bold red)'
vimcmd_symbol = '[◀](bold cyan)'

# Rail and local timestamp mark when each command prompt was drawn.
[fill]
symbol = '─'
style = '#263d43'

[time]
disabled = false
time_format = '%H:%M'
format = '[─](muted)[ $time ](cyan)'

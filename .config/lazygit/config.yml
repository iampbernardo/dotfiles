gui:
  nerdFontsVersion: "3"
  theme:
    activeBorderColor:
      - "#7aa2f7"
      - bold
    inactiveBorderColor:
      - "#565f89"
    optionsTextColor:
      - "#7aa2f7"
    selectedLineBgColor:
      - "#283457"
    cherryPickedCommitBgColor:
      - "#3d59a1"
    cherryPickedCommitFgColor:
      - "#7dcfff"
    unstagedChangesColor:
      - "#f7768e"
    defaultFgColor:
      - "#c0caf5"
  authorColors:
    "*": "#bb9af7"
  showFileTree: true
git:
  paging:
    colorArg: always
    pager: delta --dark --paging=never
